name: Portfolio security and quality

on:
  push:
    branches:
      - main
      - chore/remove-homepage-video
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  security-events: write

jobs:
  portfolio:
    name: Frontend audit, links, build and browser checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install frontend dependencies
        run: npm ci
        working-directory: portfolio

      - name: Audit frontend dependencies
        run: npm audit --audit-level=high
        working-directory: portfolio

      - name: Check internal routes, sitemap and content
        run: npm run check:links
        working-directory: portfolio

      - name: Lint frontend
        run: npm run lint
        working-directory: portfolio

      - name: Build frontend
        run: npm run build
        working-directory: portfolio

      - name: Install temporary browser-test dependency
        run: npm install --no-save --package-lock=false playwright
        working-directory: portfolio

      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium
        working-directory: portfolio

      - name: Start Vite preview and test responsive routes
        working-directory: portfolio
        shell: bash
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/portfolio-preview.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill "$PREVIEW_PID" 2>/dev/null || true' EXIT

          READY=0
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then
              READY=1
              break
            fi
            sleep 1
          done

          if [ "$READY" -ne 1 ]; then
            cat /tmp/portfolio-preview.log
            exit 1
          fi

          PORTFOLIO_URL=http://127.0.0.1:4173 node scripts/mobile-smoke.mjs

  contact-worker:
    name: Contact Worker audit and tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install Worker dependencies
        run: npm ci
        working-directory: contact-backend

      - name: Audit Worker dependencies
        run: npm audit --audit-level=high
        working-directory: contact-backend

      - name: Run Worker tests
        run: npm test -- --run
        working-directory: contact-backend

  codeql:
    name: CodeQL source analysis
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          queries: security-extended

      - name: Analyze source
        uses: github/codeql-action/analyze@v4
