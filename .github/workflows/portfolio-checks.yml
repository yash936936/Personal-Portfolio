name: Portfolio checks

on:
  push:
    branches:
      - main
      - portfolio/v2-engineering-refinement
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  portfolio:
    name: Portfolio lint and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: portfolio/package-lock.json
      - run: npm ci
        working-directory: portfolio
      - name: Summarize remaining dependency advisories
        run: |
          npm audit --json > /tmp/portfolio-audit.json || true
          node -e 'const audit = require("/tmp/portfolio-audit.json"); for (const [name, item] of Object.entries(audit.vulnerabilities ?? {})) console.log(JSON.stringify({ name, severity: item.severity, range: item.range, fixAvailable: item.fixAvailable }));'
        working-directory: portfolio
      - name: Audit production dependencies
        run: npm audit --omit=dev
        working-directory: portfolio
      - run: npm run lint
        working-directory: portfolio
      - run: npm run build
        working-directory: portfolio
        env:
          VITE_SITE_URL: https://portfolio.example.com
      - name: Install isolated browser-test dependency
        run: npm install --no-save --no-package-lock playwright
        working-directory: portfolio
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
        working-directory: portfolio
      - name: Test responsive routes and navigation
        run: |
          npm run preview -- --host 127.0.0.1 > /tmp/portfolio-preview.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill "$PREVIEW_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then break; fi
            sleep 1
          done
          PORTFOLIO_URL=http://127.0.0.1:4173 npm run qa:site
        working-directory: portfolio

  contact-worker:
    name: Contact Worker tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: contact-backend/package-lock.json
      - run: npm ci
        working-directory: contact-backend
      - run: npm test
        working-directory: contact-backend
