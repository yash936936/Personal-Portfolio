name: One-time portfolio source repair

on:
  push:
    branches:
      - chore/remove-homepage-video

permissions:
  contents: write

jobs:
  repair:
    if: github.event.head_commit.message == 'Install one-time source repair workflow'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v7
        with:
          ref: chore/remove-homepage-video
          token: ${{ github.token }}
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Restore original source files from verified snapshot
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            https://sb-3dhawlw53bg8.vercel.run/repair.tar.gz \
            --output /tmp/portfolio-repair.tar.gz
          tar -tzf /tmp/portfolio-repair.tar.gz
          tar -xzf /tmp/portfolio-repair.tar.gz -C "$GITHUB_WORKSPACE"

      - name: Validate frontend dependencies, routes and build
        working-directory: portfolio
        run: |
          npm ci
          npm audit --audit-level=high
          npm run check:links
          npm run lint
          npm run build

      - name: Validate Worker dependencies, tests and types
        working-directory: contact-backend
        run: |
          npm ci
          npm audit --audit-level=high
          npm test -- --run
          npx tsc --noEmit -p tsconfig.json
          npx tsc --noEmit -p test/tsconfig.json

      - name: Run responsive browser tests
        working-directory: portfolio
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --package-lock=false playwright
          npx playwright install --with-deps chromium
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/portfolio-preview.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill "$PREVIEW_PID" 2>/dev/null || true' EXIT

          READY=0
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then
              READY=1
              break
            fi
            sleep 1
          done

          if [ "$READY" -ne 1 ]; then
            cat /tmp/portfolio-preview.log
            exit 1
          fi

          PORTFOLIO_URL=http://127.0.0.1:4173 node scripts/mobile-smoke.mjs

      - name: Commit repaired source and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/repair-source-once.yml
          git add \
            contact-backend/package.json \
            contact-backend/package-lock.json \
            contact-backend/vitest.config.mts \
            contact-backend/test/tsconfig.json \
            portfolio/package-lock.json \
            portfolio/scripts/check-links.mjs \
            portfolio/scripts/mobile-smoke.mjs \
            portfolio/src/components/Footer.tsx \
            portfolio/src/components/Nav.tsx \
            portfolio/src/components/sections/SkillsRotator.tsx \
            portfolio/src/data/content.ts \
            portfolio/src/pages/Contact.tsx
          git commit -m "Repair truncated source files and dependency locks"
          git push origin HEAD:refs/heads/chore/remove-homepage-video
