<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="790" viewBox="0 0 1440 790" role="img" aria-labelledby="title desc">
<title id="title">AGM: how memory is recorded and retrieved</title>
<desc id="desc">Two connected stages. Record: memory arrives, trust and scope are checked, an immutable SQLite event is written, and rebuildable search views are refreshed. Retrieve: a question arrives, keyword and vector search find candidates, graph expansion adds related context, then scope and validity checks decide whether to return memory or abstain. AGM does not generate the language-model answer.</desc>
<defs><filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#514a40" flood-opacity=".08"/></filter></defs>
<style>
.eyebrow{font:700 13px Arial,sans-serif;letter-spacing:2px}.number{font:700 13px Arial,sans-serif}
.card-title{font:600 22px Arial,sans-serif;fill:#292822}.card-copy{font:400 15px Arial,sans-serif;fill:#6f6b62}
.main-title{font:600 34px Arial,sans-serif;fill:#292822}.sub-title{font:400 17px Arial,sans-serif;fill:#777268}
.lane-title{font:700 14px Arial,sans-serif;letter-spacing:2.5px}.note-label{font:700 12px Arial,sans-serif;letter-spacing:2px;fill:#9b694f}
.note-copy{font:400 16px Arial,sans-serif;fill:#625d54}
</style>
<rect width="1440" height="790" rx="28" fill="#f8f7f1"/>
<circle cx="1365" cy="66" r="110" fill="#d7c9b2" opacity=".12"/><circle cx="70" cy="748" r="130" fill="#c7d4c5" opacity=".10"/>
<text x="58" y="68" class="eyebrow" fill="#b8755b">A SIMPLE VIEW OF THE SYSTEM</text>
<text x="58" y="121" class="main-title">AGM · How memory is recorded and retrieved</text>
<text x="58" y="169" class="sub-title">Two connected jobs: save useful facts, then find the right context when an agent needs it.</text>
<rect x="34" y="140" width="1372" height="250" rx="22" fill="#fffefa" fill-opacity=".44" stroke="#78947b" stroke-opacity=".55" stroke-width="2"/>
<rect x="60" y="122" width="190" height="40" rx="12" fill="#78947b" fill-opacity=".16" stroke="#78947b" stroke-width="1.5"/>
<text x="155" y="148" text-anchor="middle" class="lane-title" fill="#78947b">RECORD</text>
<rect x="48" y="176" width="310" height="192" rx="22" fill="#fffefa" stroke="#78947b" stroke-opacity=".45" stroke-width="2" filter="url(#shadow)"/>
<circle cx="83" cy="211" r="19" fill="#78947b" fill-opacity=".16" stroke="#78947b" stroke-width="1.5"/><text x="83" y="217" text-anchor="middle" class="number" fill="#78947b">01</text>
<text x="114" y="216" class="eyebrow" fill="#78947b">STEP 01</text>
<text x="72" y="267" class="card-title">Memory arrives</text>
<text x="72" y="319" class="card-copy"><tspan x="72">An agent or app sends a fact</tspan><tspan x="72" dy="20">with its source and scope.</tspan></text>
<path d="M 365 272 L 386 272 M 376 261 L 388 272 L 376 283" fill="none" stroke="#78947b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="396" y="176" width="310" height="192" rx="22" fill="#fffefa" stroke="#7897bd" stroke-opacity=".45" stroke-width="2" filter="url(#shadow)"/>
<circle cx="431" cy="211" r="19" fill="#7897bd" fill-opacity=".16" stroke="#7897bd" stroke-width="1.5"/><text x="431" y="217" text-anchor="middle" class="number" fill="#7897bd">02</text>
<text x="462" y="216" class="eyebrow" fill="#7897bd">STEP 02</text>
<text x="420" y="267" class="card-title">Core checks it</text>
<text x="420" y="319" class="card-copy"><tspan x="420">MemoryStore checks writer, trust,</tspan><tspan x="420" dy="20">provenance and lifecycle rules.</tspan></text>
<path d="M 713 272 L 734 272 M 724 261 L 736 272 L 724 283" fill="none" stroke="#78947b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="744" y="176" width="310" height="192" rx="22" fill="#fffefa" stroke="#9a88b5" stroke-opacity=".45" stroke-width="2" filter="url(#shadow)"/>
<circle cx="779" cy="211" r="19" fill="#9a88b5" fill-opacity=".16" stroke="#9a88b5" stroke-width="1.5"/><text x="779" y="217" text-anchor="middle" class="number" fill="#9a88b5">03</text>
<text x="810" y="216" class="eyebrow" fill="#9a88b5">STEP 03</text>
<text x="768" y="267" class="card-title">Event is saved</text>
<text x="768" y="319" class="card-copy"><tspan x="768">SQLite appends an immutable event.</tspan><tspan x="768" dy="20">This history is the source of truth.</tspan></text>
<path d="M 1061 272 L 1082 272 M 1072 261 L 1084 272 L 1072 283" fill="none" stroke="#78947b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="1092" y="176" width="300" height="192" rx="22" fill="#fffefa" stroke="#c99b59" stroke-opacity=".55" stroke-width="2" filter="url(#shadow)"/>
<circle cx="1127" cy="211" r="19" fill="#c99b59" fill-opacity=".16" stroke="#c99b59" stroke-width="1.5"/><text x="1127" y="217" text-anchor="middle" class="number" fill="#c99b59">04</text>
<text x="1158" y="216" class="eyebrow" fill="#c99b59">STEP 04</text>
<text x="1116" y="267" class="card-title">Search views update</text>
<text x="1116" y="319" class="card-copy"><tspan x="1116">Node, edge, keyword and vector</tspan><tspan x="1116" dy="20">views can be rebuilt from events.</tspan></text>
<rect x="34" y="414" width="1372" height="250" rx="22" fill="#fffefa" fill-opacity=".44" stroke="#7897bd" stroke-opacity=".55" stroke-width="2"/>
<rect x="60" y="396" width="190" height="40" rx="12" fill="#7897bd" fill-opacity=".16" stroke="#7897bd" stroke-width="1.5"/>
<text x="155" y="422" text-anchor="middle" class="lane-title" fill="#7897bd">RETRIEVE</text>
<rect x="48" y="450" width="310" height="192" rx="22" fill="#fffefa" stroke="#78947b" stroke-opacity=".45" stroke-width="2" filter="url(#shadow)"/>
<circle cx="83" cy="485" r="19" fill="#78947b" fill-opacity=".16" stroke="#78947b" stroke-width="1.5"/><text x="83" y="491" text-anchor="middle" class="number" fill="#78947b">01</text>
<text x="114" y="490" class="eyebrow" fill="#78947b">STEP 01</text>
<text x="72" y="541" class="card-title">A question arrives</text>
<text x="72" y="593" class="card-copy"><tspan x="72">A caller submits a question</tspan><tspan x="72" dy="20">and the scope it can search.</tspan></text>
<path d="M 365 546 L 386 546 M 376 535 L 388 546 L 376 557" fill="none" stroke="#7897bd" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="396" y="450" width="310" height="192" rx="22" fill="#fffefa" stroke="#7897bd" stroke-opacity=".45" stroke-width="2" filter="url(#shadow)"/>
<circle cx="431" cy="485" r="19" fill="#7897bd" fill-opacity=".16" stroke="#7897bd" stroke-width="1.5"/><text x="431" y="491" text-anchor="middle" class="number" fill="#7897bd">02</text>
<text x="462" y="490" class="eyebrow" fill="#7897bd">STEP 02</text>
<text x="420" y="541" class="card-title">Find candidates</text>
<text x="420" y="593" class="card-copy"><tspan x="420">Keyword and vector search find</tspan><tspan x="420" dy="20">memories that may be useful.</tspan></text>
<path d="M 713 546 L 734 546 M 724 535 L 736 546 L 724 557" fill="none" stroke="#7897bd" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="744" y="450" width="310" height="192" rx="22" fill="#fffefa" stroke="#9a88b5" stroke-opacity=".45" stroke-width="2" filter="url(#shadow)"/>
<circle cx="779" cy="485" r="19" fill="#9a88b5" fill-opacity=".16" stroke="#9a88b5" stroke-width="1.5"/><text x="779" y="491" text-anchor="middle" class="number" fill="#9a88b5">03</text>
<text x="810" y="490" class="eyebrow" fill="#9a88b5">STEP 03</text>
<text x="768" y="541" class="card-title">Expand context</text>
<text x="768" y="593" class="card-copy"><tspan x="768">A bounded graph step adds</tspan><tspan x="768" dy="20">directly related memories.</tspan></text>
<path d="M 1061 546 L 1082 546 M 1072 535 L 1084 546 L 1072 557" fill="none" stroke="#7897bd" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="1092" y="450" width="300" height="192" rx="22" fill="#fffefa" stroke="#c99b59" stroke-opacity=".55" stroke-width="2" filter="url(#shadow)"/>
<circle cx="1127" cy="485" r="19" fill="#c99b59" fill-opacity=".16" stroke="#c99b59" stroke-width="1.5"/><text x="1127" y="491" text-anchor="middle" class="number" fill="#c99b59">04</text>
<text x="1158" y="490" class="eyebrow" fill="#c99b59">STEP 04</text>
<text x="1116" y="541" class="card-title">Filter and decide</text>
<text x="1116" y="593" class="card-copy"><tspan x="1116">Scope, validity and ranking checks</tspan><tspan x="1116" dy="20">return context or abstain.</tspan></text>
<rect x="42" y="702" width="1356" height="58" rx="16" fill="#eee9df"/>
<text x="65" y="736" class="note-label">IN SIMPLE TERMS</text>
<text x="260" y="736" class="note-copy">AGM stores and retrieves memory. The calling agent remains responsible for generating the answer.</text>
</svg>