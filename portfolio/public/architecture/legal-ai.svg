<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="700" viewBox="0 0 1440 700" role="img" aria-labelledby="title desc">
  <title id="title">Legal AI Assistant · From question to grounded response</title>
  <desc id="desc">One interface supports two paths: legal information and structured contract analysis. The assistant provides legal information and contract-analysis support, not a substitute for advice from a qualified legal professional.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#514a40" flood-opacity=".08"/>
    </filter>
  </defs>
  <style>
    .eyebrow{font:700 13px Arial,sans-serif;letter-spacing:2px}
    .number{font:700 13px Arial,sans-serif}
    .card-title{font:600 24px Arial,sans-serif;fill:#292822}
    .card-copy{font:400 16px Arial,sans-serif;fill:#6f6b62}
    .main-title{font:600 34px Arial,sans-serif;fill:#292822}
    .sub-title{font:400 17px Arial,sans-serif;fill:#777268}
    .lane-title{font:700 14px Arial,sans-serif;letter-spacing:2.5px}
    .note-label{font:700 12px Arial,sans-serif;letter-spacing:2px;fill:#9b694f}
    .note-copy{font:400 16px Arial,sans-serif;fill:#625d54}
  </style>
  <rect width="1440" height="700" rx="28" fill="#f8f7f1"/>
  <circle cx="1365" cy="66" r="110" fill="#d7c9b2" opacity=".12"/>
  <circle cx="70" cy="658" r="130" fill="#c7d4c5" opacity=".10"/>
  <text x="58" y="68" class="eyebrow" fill="#b8755b">A SIMPLE VIEW OF THE SYSTEM</text>
  <text x="58" y="121" class="main-title"><tspan x="58" dy="0">Legal AI Assistant · From question to grounded response</tspan></text>
  <text x="58" y="169" class="sub-title"><tspan x="58" dy="0">One interface supports two paths: legal information and structured contract analysis.</tspan></text>
  <g filter="url(#shadow)">
    <g>
      <rect x="42" y="238" width="316" height="260" rx="22" fill="#fffefa" stroke="#78947b" stroke-opacity=".45" stroke-width="2"/>
      <circle cx="77" cy="273" r="19" fill="#78947b" fill-opacity=".16" stroke="#78947b" stroke-width="1.5"/>
      <text x="77" y="279" text-anchor="middle" class="number" fill="#78947b">01</text>
      <text x="108" y="278" class="eyebrow" fill="#78947b">STEP 01</text>
      <text x="66" y="329" class="card-title"><tspan x="66" dy="0">Choose a workflow</tspan></text>
      <text x="66" y="381" class="card-copy"><tspan x="66" dy="0">The user selects the legal-advisor</tspan><tspan x="66" dy="23">or contract-analysis mode.</tspan></text>
    </g></g><path d="M 363 368 L 376 368 M 364 357 L 376 368 L 364 379" fill="none" stroke="#a29b8e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><g filter="url(#shadow)">
    <g>
      <rect x="392" y="238" width="316" height="260" rx="22" fill="#fffefa" stroke="#7897bd" stroke-opacity=".45" stroke-width="2"/>
      <circle cx="427" cy="273" r="19" fill="#7897bd" fill-opacity=".16" stroke="#7897bd" stroke-width="1.5"/>
      <text x="427" y="279" text-anchor="middle" class="number" fill="#7897bd">02</text>
      <text x="458" y="278" class="eyebrow" fill="#7897bd">STEP 02</text>
      <text x="416" y="329" class="card-title"><tspan x="416" dy="0">Route the request</tspan></text>
      <text x="416" y="381" class="card-copy"><tspan x="416" dy="0">A rule-based LangGraph supervisor</tspan><tspan x="416" dy="23">selects the matching workflow.</tspan></text>
    </g></g><path d="M 713 368 L 726 368 M 714 357 L 726 368 L 714 379" fill="none" stroke="#a29b8e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><g filter="url(#shadow)">
    <g>
      <rect x="742" y="238" width="316" height="260" rx="22" fill="#fffefa" stroke="#9a88b5" stroke-opacity=".45" stroke-width="2"/>
      <circle cx="777" cy="273" r="19" fill="#9a88b5" fill-opacity=".16" stroke="#9a88b5" stroke-width="1.5"/>
      <text x="777" y="279" text-anchor="middle" class="number" fill="#9a88b5">03</text>
      <text x="808" y="278" class="eyebrow" fill="#9a88b5">STEP 03</text>
      <text x="766" y="329" class="card-title"><tspan x="766" dy="0">Retrieve legal context</tspan></text>
      <text x="766" y="381" class="card-copy"><tspan x="766" dy="0">A semantic cache, Chroma search</tspan><tspan x="766" dy="23">and BM25 results are combined.</tspan></text>
    </g></g><path d="M 1063 368 L 1076 368 M 1064 357 L 1076 368 L 1064 379" fill="none" stroke="#a29b8e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><g filter="url(#shadow)">
    <g>
      <rect x="1092" y="238" width="316" height="260" rx="22" fill="#fffefa" stroke="#c99b59" stroke-opacity=".45" stroke-width="2"/>
      <circle cx="1127" cy="273" r="19" fill="#c99b59" fill-opacity=".16" stroke="#c99b59" stroke-width="1.5"/>
      <text x="1127" y="279" text-anchor="middle" class="number" fill="#c99b59">04</text>
      <text x="1158" y="278" class="eyebrow" fill="#c99b59">STEP 04</text>
      <text x="1116" y="329" class="card-title"><tspan x="1116" dy="0">Generate the result</tspan></text>
      <text x="1116" y="381" class="card-copy"><tspan x="1116" dy="0">Gemini returns an answer or</tspan><tspan x="1116" dy="23">contract risks; an optional judge</tspan><tspan x="1116" dy="23">scores the response.</tspan></text>
    </g></g>
  <rect x="42" y="612" width="1356" height="58" rx="16" fill="#eee9df"/>
  <text x="65" y="646" class="note-label">IN SIMPLE TERMS</text>
  <text x="260" y="646" class="note-copy">The assistant provides legal information and contract-analysis support, not a substitute for advice from a qualified legal professional.</text>
</svg>